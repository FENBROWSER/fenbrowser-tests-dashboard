name: Publish FenBrowser WPT portal

on:
  workflow_call:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "history/**"
      - "tools/render_portal.py"
      - ".github/workflows/portal-release.yml"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: fenbrowser-pages
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy WPT dashboard
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.pages.outputs.page_url }}

    steps:
      - name: Checkout dashboard
        uses: actions/checkout@v4

      - name: Build static dashboard
        run: python tools/render_portal.py --history history --output public

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - name: Deploy GitHub Pages
        id: pages
        uses: actions/deploy-pages@v4
